cache:

  leaderboard:

    # How long (in seconds) leaderboard data is kept in memory before expiring.
    #
    # Raising this means players may see slightly older scores, but reduces
    # how often the plugin needs to contact PlaceholderAPI / Topper.
    #
    # Rule: always set this HIGHER than refresh-seconds, otherwise entries
    # expire before the background refresh fires and players will experience
    # a brief delay on the next open (cold-start fetch).
    #
    # Recommended by server size:
    #   Small  (<100 players)  → 600
    #   Medium (100–500)       → 300   ← default
    #   Large  (500–2000)      → 180
    #   Very large (2000+)     → 120
    #
    # Note: there is no benefit to setting this higher than however often
    # your leaderboard plugin (e.g. Topper) recalculates its scores.
    # If Topper updates every 5 minutes, caching for an hour just means
    # players always see outdated data.
    ttl-seconds: 300

    # How often (in seconds) the plugin silently refreshes cached leaderboard
    # data in the background, before the TTL expires.
    #
    # This keeps the cache warm so players never wait for a fetch when opening
    # the GUI. The refresh runs on an async thread and has negligible server cost.
    #
    # Rule: MUST be less than ttl-seconds or the cache goes cold between refreshes.
    # The plugin enforces a minimum of 60 seconds regardless of what you set here.
    #
    # Recommended: set to roughly 80% of ttl-seconds.
    #   ttl-seconds: 600  → refresh-seconds: 480
    #   ttl-seconds: 300  → refresh-seconds: 240  ← default
    #   ttl-seconds: 180  → refresh-seconds: 140
    #   ttl-seconds: 120  → refresh-seconds:  90
    refresh-seconds: 240

    # Maximum number of different leaderboard boards to keep in memory at once.
    # Each board is one entry (the full list of players for that board).
    # You only need to raise this if you have more unique board names than this value.
    # 500 is far more than enough for almost any server.
    max-size: 500

  skins:

    # How long (in minutes) player skull textures are kept in memory.
    #
    # Skins almost never change mid-session. Raising this is safe and reduces
    # the chance of a slow lookup for players who have left the server.
    #
    # Recommended by server size:
    #   Small  (<100 players)  → 120
    #   Medium (100–500)       →  60
    #   Large  (500–2000)      →  30  ← default
    #   Very large (2000+)     →  20
    #
    # Setting this to 1440 (24 hours) is reasonable on a long-running server —
    # it just means a restart is needed to pick up skin changes.
    ttl-minutes: 30

    # Maximum number of unique player skulls to keep in memory at once.
    # Each cached skull is roughly 2–5 KB, so:
    #   500  entries ≈  1–2.5 MB
    #   1000 entries ≈  2–5   MB
    #   2000 entries ≈  4–10  MB  ← default
    #   5000 entries ≈ 10–25  MB
    #
    # Best practice: set this close to your server's peak unique daily players.
    # There is no benefit to caching 10,000 skins on a 200-player server.
    #
    # Recommended by server size:
    #   Small  (<100 players)  →  500
    #   Medium (100–500)       → 1000
    #   Large  (500–2000)      → 2000  ← default
    #   Very large (2000+)     → 5000
    max-size: 2000